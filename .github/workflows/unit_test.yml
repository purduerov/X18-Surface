name: X18-Surface Unit Test

# Controls when the action will run.
# Workflow runs when manually triggered using the UI, or when a push or pull request is made to the main branch
on:
  push:
    branches:
      - ci-cd
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install core system dependencies (Dockerfile equivalent)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            python3-pip \
            python3-venv \
            python3-dev \
            wget \
            build-essential

      - name: Allow pip to break system packages (Dockerfile ENV)
        run: echo "PIP_BREAK_SYSTEM_PACKAGES=1" >> $GITHUB_ENV

      - name: Install compatible setuptools (matches Dockerfile)
        run: |
          pip3 install --upgrade "setuptools>=68.2.0,<70.0.0"

      - name: Install Python dependencies (Dockerfile COPY + pip install)
        run: |
          pip3 install --no-cache-dir -r requirements.txt

      - name: Set up ROS Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Add ROS setup to bashrc (Dockerfile RUN echo)
        run: |
          echo 'source /opt/ros/jazzy/setup.bash' >> ~/.bashrc

      - name: Export ROS_DOMAIN_ID (devcontainer.json env)
        run: echo "ROS_DOMAIN_ID=69" >> $GITHUB_ENV



      # Run the install MediaMTX script
      - name: Install MediaMTX
        run: |
          chmod +x scripts/install_mediamtx.sh
          scripts/install_mediamtx.sh

      # Build the ROS workspace
      - name: Build workspace
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh

      # Run the build script and verify ROS 2 nodes
      - name: build unit tests
        run: |
          colcon test --packages-select heartbeat_monitor
      - name: run unit tests verbose
        run: |
          colcon test-result --verbose
          
      - name: Success
        run: echo "Success!"

