
name: X17-Surface Build Test

# Controls when the action will run.
# Workflow runs when manually triggered using the UI, or when a push or pull request is made to the main branch
on:
  push:
    branches:
      - ci-cd
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up ROS 2 (Jazzy)
      - name: Set up ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      # Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip
          sudo pip3 install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y wget


      - name: Install core system dependencies (Dockerfile equivalent)
        run: |
          sudo apt-get update && sudo apt-get install -y \
            python3-pip \
            python3-venv \
            python3-dev \
            wget \
            build-essential

      - name: Allow pip to break system packages (Dockerfile ENV)
        run: echo "PIP_BREAK_SYSTEM_PACKAGES=1" >> $GITHUB_ENV

      - name: Install compatible setuptools (matches Dockerfile)
        run: |
          pip3 install --upgrade "setuptools>=68.2.0,<70.0.0"

      - name: Install Python dependencies (Dockerfile COPY + pip install)
        run: |
          pip3 install --no-cache-dir -r requirements.txt

      - name: Set up ROS Jazzy (matches base image)
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Add ROS setup to bashrc (Dockerfile RUN echo)
        run: |
          echo 'source /opt/ros/jazzy/setup.bash' >> ~/.bashrc

      - name: Export ROS_DOMAIN_ID (devcontainer.json env)
        run: echo "ROS_DOMAIN_ID=69" >> $GITHUB_ENV



      # Run the install MediaMTX script
      - name: Install MediaMTX
        run: |
          chmod +x scripts/install_mediamtx.sh
          scripts/install_mediamtx.sh

      # Build the ROS workspace
      - name: Build workspace
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh

      # Run the build script and verify ROS 2 nodes
      - name: Start and check ROS 2 nodes
        run: |
          set -e
          source /opt/ros/humble/setup.bash

          echo "Starting ROS 2 nodes..."
          chmod +x scripts/run.sh
          ./scripts/run.sh &
          RUN_PID=$!

          # Wait for nodes to start
          sleep 15

          echo "Checking running nodes..."
          NODE_LIST=$(ros2 node list || true)
          echo "$NODE_LIST"

          EXPECTED_NODES="/heartbeat_monitor.py"

          for NODE in $EXPECTED_NODES; do
            if [[ ! "$NODE_LIST" =~ "$NODE" ]]; then
              echo "❌ ERROR: $NODE node not found"
              kill $RUN_PID || true
              exit 1
            fi
          done

          echo "✅ All nodes successfully launched."
          kill $RUN_PID || true

      - name: Success
        run: echo "Success!"

