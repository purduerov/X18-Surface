
name: X17-Surface Build Test

on:
  push:
    branches:
      - ci-cd
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04   # Humble is for Ubuntu 22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install ROS 2 Humble (correct for Ubuntu 22.04)
      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      # Dockerfile: Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            python3-pip \
            python3-venv \
            python3-dev \
            wget \
            build-essential

      # Match Dockerfile: pip break system pkgs
      - name: Allow pip to break system packages
        run: echo "PIP_BREAK_SYSTEM_PACKAGES=1" >> $GITHUB_ENV

      # CRITICAL: Fix setuptools version (prevents canonicalize_version bug)
      - name: Force safe setuptools version for ROS builds
        run: |
          pip3 uninstall -y setuptools || true
          sudo pip3 uninstall -y setuptools || true
          pip3 install --force-reinstall "setuptools==69.5.1"

      - name: Verify setuptools version
        run: python3 - << 'EOF'
import setuptools
print("Using setuptools version:", setuptools.__version__)
EOF

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          pip3 install --no-cache-dir -r requirements.txt

      # ROS_DOMAIN_ID (from devcontainer.json)
      - name: Export ROS_DOMAIN_ID
        run: echo "ROS_DOMAIN_ID=69" >> $GITHUB_ENV

      # Install MediaMTX
      - name: Install MediaMTX
        run: |
          chmod +x scripts/install_mediamtx.sh
          scripts/install_mediamtx.sh

      # Build ROS workspace (your script)
      - name: Build workspace
        run: |
          source /opt/ros/humble/setup.bash
          chmod +x scripts/build.sh
          scripts/build.sh

      # Run nodes + check heartbeat_monitor
      - name: Start and check ROS 2 nodes
        run: |
          set -e
          source /opt/ros/humble/setup.bash

          echo "Starting ROS 2 nodes..."
          chmod +x scripts/run.sh
          ./scripts/run.sh &
          RUN_PID=$!

          sleep 15

          echo "Checking running nodes..."
          NODE_LIST=$(ros2 node list || true)
          echo "$NODE_LIST"

          EXPECTED_NODES="/heartbeat_monitor.py"

          for NODE in $EXPECTED_NODES; do
            if [[ ! "$NODE_LIST" =~ "$NODE" ]]; then
              echo "❌ ERROR: $NODE node not found"
              kill $RUN_PID || true
              exit 1
            fi
          done

          echo "✅ All nodes successfully launched."
          kill $RUN_PID || true

      - name: Success
        run: echo "Success!"

